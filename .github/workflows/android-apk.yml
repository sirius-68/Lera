name: Android APK

on:
  push:
    branches: [main, android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional AI backend, baked in at build time (see src/ai/config.ts).
      # Add these under Settings → Secrets and variables → Actions. Leave them unset to build without AI.
      LERA_AI_BASE_URL: ${{ secrets.LERA_AI_BASE_URL }}
      LERA_AI_MODEL: ${{ secrets.LERA_AI_MODEL }}
      LERA_AI_KEY: ${{ secrets.LERA_AI_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Android behaviour (text menu, keyboard, system bars)
        run: |
          # Lera's own web view class: selection works, Android's Copy/Share menu stays empty
          pkg=android/app/src/main/java/com/sirius68/lera
          cp android-overrides/LeraWebView.java "$pkg/"
          # MainActivity pads the page for the status bar, navigation bar and keyboard, so typing is never covered
          cp android-overrides/MainActivity.java "$pkg/"
          grep -q 'windowSoftInputMode' android/app/src/main/AndroidManifest.xml || sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:windowSoftInputMode="adjustResize"#' android/app/src/main/AndroidManifest.xml
          grep -q 'windowSoftInputMode' android/app/src/main/AndroidManifest.xml
          layout=$(find node_modules/@capacitor/android -name '*bridge_layout_main.xml' | head -n 1)
          test -n "$layout"
          mkdir -p android/app/src/main/res/layout
          sed 's/com\.getcapacitor\.CapacitorWebView/com.sirius68.lera.LeraWebView/' "$layout" > "android/app/src/main/res/layout/$(basename "$layout")"
          grep -q 'com.sirius68.lera.LeraWebView' "android/app/src/main/res/layout/$(basename "$layout")"

      - name: Allow vibration
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$manifest" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$manifest"

      - name: Use Lera's icon
        run: |
          res=android/app/src/main/res
          # drop the default adaptive (vector) icons so the PNGs below are used
          rm -rf $res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/icon-192.png $res/mipmap-$d/ic_launcher.png
            cp public/icon-192.png $res/mipmap-$d/ic_launcher_round.png
            rm -f $res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/lera-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lera-debug-apk
          path: out/*.apk
          retention-days: 30
