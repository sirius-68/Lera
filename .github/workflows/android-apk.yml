name: Android APK

on:
  push:
    branches: [main, android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional AI backend, baked in at build time (see src/ai/config.ts).
      # Add these under Settings → Secrets and variables → Actions. Leave them unset to build without AI.
      # the address of Lera's AI router (backend/). No AI key is ever given to the build.
      LERA_AI_URL: ${{ secrets.LERA_AI_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Android behaviour (text menu, keyboard, system bars)
        run: |
          # Lera's own web view class: selection works, Android's Copy/Share menu stays empty
          pkg=android/app/src/main/java/com/sirius68/lera
          cp android-overrides/LeraWebView.java "$pkg/"
          # MainActivity pads the page for the status bar, navigation bar and keyboard, so typing is never covered
          cp android-overrides/MainActivity.java "$pkg/"
          grep -q 'windowSoftInputMode' android/app/src/main/AndroidManifest.xml || sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:windowSoftInputMode="adjustResize"#' android/app/src/main/AndroidManifest.xml
          grep -q 'windowSoftInputMode' android/app/src/main/AndroidManifest.xml
          layout=$(find node_modules/@capacitor/android -name '*bridge_layout_main.xml' | head -n 1)
          test -n "$layout"
          mkdir -p android/app/src/main/res/layout
          sed 's/com\.getcapacitor\.CapacitorWebView/com.sirius68.lera.LeraWebView/' "$layout" > "android/app/src/main/res/layout/$(basename "$layout")"
          grep -q 'com.sirius68.lera.LeraWebView' "android/app/src/main/res/layout/$(basename "$layout")"

      - name: Home-screen widget
        run: |
          pkg=android/app/src/main/java/com/sirius68/lera
          manifest=android/app/src/main/AndroidManifest.xml
          cp android-overrides/StreakWidget.java android-overrides/StreakWidgetWide.java android-overrides/WidgetBridge.java "$pkg/"
          cp -r android-overrides/res/. android/app/src/main/res/
          grep -q 'StreakWidget' "$manifest" || python3 - "$manifest" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          receiver = """
                  <receiver android:name=".StreakWidget" android:exported="false" android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/streak_widget_info" />
                  </receiver>
                  <receiver android:name=".StreakWidgetWide" android:exported="false" android:label="@string/widget_wide_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/streak_widget_wide_info" />
                  </receiver>
              </application>"""
          assert "</application>" in text
          open(path, "w").write(text.replace("</application>", receiver.lstrip("\n"), 1))
          PY
          grep -q 'StreakWidget' "$manifest"

      - name: Allow vibration
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$manifest" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$manifest"

      - name: Use Lera's icon
        run: |
          res=android/app/src/main/res
          # her face fills the icon: an adaptive icon on Android 8+, the same picture as a PNG before that
          rm -rf $res/mipmap-anydpi-v26
          cp -r android-overrides/res/mipmap-anydpi-v26 $res/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/icon-192.png $res/mipmap-$d/ic_launcher.png
            cp public/icon-192.png $res/mipmap-$d/ic_launcher_round.png
            rm -f $res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/lera-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lera-debug-apk
          path: out/*.apk
          retention-days: 30
