name: Android APK

on:
  push:
    branches: [main, android-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use Lera's icon
        run: |
          res=android/app/src/main/res
          # drop the default adaptive (vector) icons so the PNGs below are used
          rm -rf $res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/icon-192.png $res/mipmap-$d/ic_launcher.png
            cp public/icon-192.png $res/mipmap-$d/ic_launcher_round.png
            rm -f $res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/lera-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lera-debug-apk
          path: out/*.apk
          retention-days: 30
