name: Native app (Expo)

# The React Native build of Lera (MIGRATION.md). It lives on the `native` branch until it matches the
# web build feature for feature; the app people test is still built by android-apk.yml.
on:
  push:
    branches: [native]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Shared logic tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Install the app
        working-directory: apps/mobile
        run: npm ci

      - name: Build the web screens the app carries, and copy the widgets in
        working-directory: apps/mobile
        env:
          LERA_AI_BASE_URL: ${{ secrets.LERA_AI_BASE_URL }}
          LERA_AI_MODEL: ${{ secrets.LERA_AI_MODEL }}
          LERA_AI_KEY: ${{ secrets.LERA_AI_KEY }}
          LERA_AUTH_URL: ${{ secrets.LERA_AUTH_URL }}
        run: npm run prepare-native

      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck

      - name: iOS bundle compiles
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/lera-ios

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: lera-native-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Does the iPhone app compile? Built for the simulator, unsigned: it proves the native side builds,
  # it is not something to install. A real iPhone build needs an Apple Developer account.
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Install the app
        working-directory: apps/mobile
        run: npm ci
      - name: Build the web screens the app carries
        working-directory: apps/mobile
        run: node scripts/build-island.mjs
      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios
      - name: Compile for the simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace *.xcworkspace -scheme "$(ls -d *.xcodeproj | head -1 | sed 's/.xcodeproj//')" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > /tmp/xcode.log 2>&1 || { grep -E "error:|error |BUILD FAILED" /tmp/xcode.log | head -40; exit 1; }
          tail -3 /tmp/xcode.log
